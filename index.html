<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Aoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Todo Aoi</h1>
  </header>

  <main>

    <section aria-label="Filter tasks">
      <label for="filterPriority">Priority:</label>
      <select id="filterPriority">
        <option value="All">All</option>
        <option value="Low">Low</option>
        <option value="Med">Med</option>
        <option value="High">High</option>
      </select>

      <label for="filterTag">Tag:</label>
      <select id="filterTag">
        <option value="All">All</option>
        <option value="School">School</option>
        <option value="Personal">Personal</option>
        <option value="Others">Others</option>
      </select>

      <button id="addTaskBtn" type="button">+ Add task</button>
    </section>

    <section id="taskList" aria-label="Tasks">
      <!-- script.js renders task items in here -->
    </section>

    <section id="task-dialog-sec">
      <dialog id="task-dialog"></dialog>
    </section>

  </main>

  <script type="module" src="scripts\script.js"></script>
</body>
</html>
