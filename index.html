<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Aoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <h1>Todo Aoi</h1>
    </div>
  </header>

  <main class="dashboard">

<<<<<<< Updated upstream
    <!-- Summary: quick peeks, gives the dashboard something to report in the surface-->
    <section class="summary-strip" aria-label="Task Overview">
      <div class="summary-stat">
        <span class="summary-number" id="statTotal">0</span>
        <span class="summary-label">total</span>
      </div>
      <div class="summary-stat">
        <span class="summary-number" id="statHigh" cent>0</span>
        <span class="summary-label">high priority</span>  
      </div>
      <div class="summary-stat">
        <span class="summary-number" id="statMed">0</span>
        <span class="summary-label">medium   priority</span>  
      </div>
      <div class="summary-stat">
        <span class="summary-number" id="statLow">0</span>
        <span class="summary-label">low priority</span>
      </div>
      <div class="summary-stat">
        <span class="summary-number" id="statOverdue">0</span>
        <span class="summary-label">Overdue</span>
      </div>
    </section>

    <!--
    Filter row: select which tasks to show and how to sort them. JS listens for changes and re-renders the task list accordingly.
    -->
    <section class="filter-row" aria-label="Filter tasks">
      <label for="filterTag" class="filter-label">Show:</label>
      <select id="filterTag" class="filter-select">
        <option value="All">All tasks</option>
        <option value="School">School</option>
        <option value="Personal">Personal</option>
        <option value="Others">Others</option>
      </select>

      <label class="filter-label" for="sortTasks">Sort by:</label>
      <select class="filter-select" id="sortTasks">
        <option value="priority">Priority</option>
        <option value="created">Date added</option>
      </select>
    </section>

    <section class="summary-strip" id="taskTally" aria-label="Task tally"></section>

    <section class="task-list" id="taskList" aria-label="Tasks">
      <!-- Empty state shown by default; (TBI)JS hides this once a task exists -->
      <div class="empty-state" id="emptyState">
        <p class="empty-title">Nothing on the to-do list yet.</p>
        <p class="empty-sub">Click "+Add Task" to get started.</p>
      </div>
      <!-- script.js renders task items in here -->
    </section>

    <section id="task-dialog-sec">
      <dialog class="task-dialog" id="task-dialog"></dialog>
    </section>

  </main>

  <script type="module" src="scripts/script.js"></script>
</body>
</html>
