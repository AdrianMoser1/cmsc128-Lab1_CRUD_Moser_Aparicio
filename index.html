<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Aoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <h1>Todo Aoi</h1>
    </div>
  </header>

  <main class="dashboard">

    <section class="filter-row" aria-label="Task view options">
      <label class="filter-label" for="filterTag">Show:</label>
      <select class="filter-select" id="filterTag">
        <option value="All">All</option>
        <option value="School">School</option>
        <option value="Personal">Personal</option>
        <option value="Other">Other</option>
      </select>

      <label class="filter-label" for="sortTasks">Sort by:</label>
      <select class="filter-select" id="sortTasks">
        <option value="priority">Priority</option>
        <option value="dueDate">Due date</option>
        <option value="createdAt">Date created</option>
      </select>

      <label class="completed-toggle" for="showCompleted">
        <input type="checkbox" id="showCompleted">
        <span class="completed-toggle-mark" aria-hidden="true">✓</span>
        <span>Show completed</span>
      </label>

      <button class="btn btn-primary" id="addTaskBtn" type="button">+ Add task</button>
    </section>

    <section class="summary-strip" id="taskTally" aria-label="Task tally"></section>

    <section class="task-list" id="taskList" aria-label="Tasks">
      <small class="task-list-hint">Click existing tasks to edit.</small>
      <div class="empty-state" id="emptyState">
        <p class="empty-title">You have no tasks yet!</p>
        <p class="empty-sub">
          Click here to make one
          <button class="btn btn-primary" id="emptyAddTaskBtn" type="button">Add Task</button>
        </p>
      </div>
      <!-- script.js renders task items in here -->
    </section>

    <section id="task-dialog-sec">
      <dialog class="task-dialog" id="task-dialog"></dialog>
    </section>

  </main>

  <script type="module" src="scripts/script.js"></script>
</body>
</html>
