<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · Todo Aoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <h1>Todo Aoi</h1>
    </div>
  </header>

  <main class="dashboard auth-page">
    <section class="auth-card" aria-label="Log in">
      <h2>Welcome back</h2>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" placeholder="Your password" required autocomplete="current-password">
        </div>

        <p class="field-error" id="loginError" role="alert" hidden></p>
        <p class="field-success" id="loginSuccess" role="status" hidden></p>

        <button class="btn btn-primary" type="submit">Log In</button>
      </form>

      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <script type="module">
    import { redirect_if_authenticated } from "../scripts/dependencies/auth_connection.js";
    import { setup_login_form } from "../scripts/components/login_form.js";

    // Guest-only page: if a session already exists, skip the form entirely.
    redirect_if_authenticated();
    setup_login_form();
  </script>
</body>
</html>
