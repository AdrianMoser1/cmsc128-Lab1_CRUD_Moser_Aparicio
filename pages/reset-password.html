<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password · Todo Aoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <h1>Todo Aoi</h1>
    </div>
  </header>

  <main class="dashboard auth-page">
    <section class="auth-card" aria-labelledby="resetPasswordTitle">
      <h2 id="resetPasswordTitle">Set a new password</h2>
      <p class="auth-help-text">Choose a new password for your account.</p>

      <form id="resetPasswordForm" novalidate>
        <div class="field">
          <label for="newPassword">New password</label>
          <div class="password-field">
            <input type="password" id="newPassword" name="password" placeholder="At least 8 characters" required autocomplete="new-password">
            <button type="button" class="password-toggle" data-toggle-password aria-label="Show password" title="Show password">
              <i class="fa fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-field">
            <input type="password" id="confirmPassword" name="confirm_password" placeholder="Repeat your password" required autocomplete="new-password">
            <button type="button" class="password-toggle" data-toggle-password aria-label="Show password" title="Show password">
              <i class="fa fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <p class="field-error" id="resetPasswordError" role="alert" hidden></p>

        <button class="btn btn-primary" type="submit">Set new password</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to login</a></p>
    </section>
  </main>

  <script type="module">
    import { setup_reset_password_form } from "../scripts/components/reset_password_form.js";
    import { setup_password_toggle } from "../scripts/components/password_toggle.js";

    setup_password_toggle();
    setup_reset_password_form();
  </script>
</body>
</html>
