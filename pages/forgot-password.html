<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · Todo Aoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <h1>Todo Aoi</h1>
    </div>
  </header>

  <main class="dashboard auth-page">
    <section class="auth-card" aria-labelledby="forgotPasswordTitle">
      <h2 id="forgotPasswordTitle">Reset your password</h2>
      <p class="auth-help-text">Enter the email on your account and we'll send you a link to set a new password.</p>

      <form id="forgotPasswordForm" novalidate>
        <div class="field">
          <label for="forgotPasswordEmail">Email</label>
          <input type="email" id="forgotPasswordEmail" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <p id="forgotPasswordStatus" role="status" hidden></p>

        <button class="btn btn-primary" type="submit">Send reset link</button>
      </form>

      <p class="auth-switch">Remembered it after all? <a href="login.html">Back to login</a></p>
    </section>
  </main>

  <script type="module">
    import { redirect_if_authenticated } from "../scripts/dependencies/auth_connection.js";
    import { setup_forgot_password_form } from "../scripts/components/forgot_password_form.js";

    // Guest-only page: an already-logged-in user should manage their password from
    // Account settings instead, not this unauthenticated recovery flow.
    redirect_if_authenticated();
    setup_forgot_password_form();
  </script>
</body>
</html>
